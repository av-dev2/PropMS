# CI: sets up a Frappe bench and runs the PropMS test suite.
#
# TODO before this will run green:
#   - Confirm FRAPPE_BRANCH matches what PropMS is built against.
#   - If PropMS depends on ERPNext, uncomment the `bench get-app erpnext`
#     step and set ERPNEXT_BRANCH.
#   - Confirm the default/target branches under `on:` match your repo
#     (develop vs main).

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  FRAPPE_BRANCH: version-15   # TODO: confirm
  # ERPNEXT_BRANCH: version-15   # TODO: uncomment if PropMS depends on erpnext

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

    steps:
      - name: Checkout PropMS
        uses: actions/checkout@v4
        with:
          path: apps/propms

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # TODO: confirm

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf mariadb-client

      - name: Install bench
        run: pip install frappe-bench

      - name: Init bench
        run: |
          bench init frappe-bench \
            --frappe-branch ${{ env.FRAPPE_BRANCH }} \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)"

      # - name: Get ERPNext (uncomment if PropMS depends on it)
      #   working-directory: frappe-bench
      #   run: bench get-app erpnext --branch ${{ env.ERPNEXT_BRANCH }}

      - name: Get PropMS
        working-directory: frappe-bench
        run: bench get-app propms ../apps/propms

      - name: Configure bench for CI services
        working-directory: frappe-bench
        run: |
          bench set-mariadb-host 127.0.0.1
          bench set-redis-cache-host redis://localhost:13000
          bench set-redis-queue-host redis://localhost:11000
          bench set-redis-socketio-host redis://localhost:11000
          sed -i 's/redis_socketio/redis_queue/g' sites/common_site_config.json || true

      - name: Create test site
        working-directory: frappe-bench
        run: |
          bench new-site test_site \
            --mariadb-root-password root \
            --admin-password admin \
            --no-mariadb-socket
          bench --site test_site install-app propms

      - name: Run PropMS tests
        working-directory: frappe-bench
        run: bench --site test_site run-tests --app propms
